final_op: [1, 0, 0, 0, 0, 0, 0, 0, 0]  # AchieveGoal is the final operation
neupi_non_effect_predicates: []

config:
  - name: "other"
    num_vectors_to_generate_list: [2, 2, 1, 2]
    domain_desc: ""
  
  # Neural unary predicate for toy (toy holding states)

  - name: "neural_u_robot"
    types: ["robot"]
    num_vectors_to_generate: 1
    gt: [[0, 2, 2, 2, 1, 1, 0, 0, 0]]
    ent_idx: [0]
    architecture: 
      type: "MLP"
      layer_size: 64
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.001
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 50
        gamma: 0.2
    batch_vect_num: 8
    batch_size: 16
    epochs: 80
    gumbel_temp: 0.7
    val_freq: 10
    num_iter: 4
    matrix_vec_try: 80
    search_tree_max_level: 1
    guidance_thresh: 10
    loss_thresh: 10
    skip_train: False  
 
  

  - name: "neural_u_table"
    types: ["table"]
    gt: [[0, 0, 0, 0, 0, 0, 0, 0, 1]]
    num_vectors_to_generate: 1
