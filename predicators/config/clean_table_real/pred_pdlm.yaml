    num_vectors_to_generate: 1
    architecture:
      type: "MLP"
      layer_size: 128
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.0008
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 60
        gamma: 0.15
    batch_vect_num: 6
    batch_size: 16
    epochs: 80
    gumbel_temp: 0.65
    val_freq: 10
    num_iter: 8
    matrix_vec_try: 100
    search_tree_max_level: 1
    guidance_thresh: 10
    loss_thresh: 10
    skip_train: False

